name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and release (e.g. v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: macos-15

    steps:
      - name: Resolve tag
        id: tag
        run: echo "name=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.name }}
          fetch-depth: 0

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Run tests
        run: swift test

      - name: Build universal release binary & package
        run: scripts/package.sh "${{ steps.tag.outputs.name }}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: core-audio-tester-${{ steps.tag.outputs.name }}-macos-universal
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

      - name: Generate release notes
        run: scripts/release-notes.sh "${{ steps.tag.outputs.name }}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.tag.outputs.name }}" \
            --title "core-audio-tester ${{ steps.tag.outputs.name }}" \
            --notes-file release-notes.md \
            --generate-notes \
            dist/*.tar.gz \
            dist/*.sha256
